# Gera e publica o instalador Windows do quiosque, em LOTE DIÁRIO.
#
# Existe porque o instalador NSIS só empacota em Windows (no Linux o
# electron-builder precisa de Wine com suporte 32-bit) — sem isto o build
# depende de alguém rodar na própria máquina, e a versão distribuída passa
# a variar conforme quem buildou.
#
# Antes, cada push na main buildava e publicava (~45 releases em 25 dias, cada
# uma com 2 jobs Windows e 105 MB baixados por terminal). Agora:
#   - push/PR só rodam testes, em Linux (ver ci.yml);
#   - este workflow roda 1x por dia às 03:00 (Brasília), só se houve mudança
#     no código do kiosk desde a última versão publicada;
#   - para urgência, dispare manualmente (workflow_dispatch). Atenção: os
#     terminais em operação se atualizam sozinhos.
#
# O job `bump-version` incrementa o patch de apps/kiosk/package.json antes do
# build: sem isso o electron-updater dos terminais ignora a publicação (ele só
# reage a versão nova).
name: Build do instalador (kiosk)

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília (UTC-3)
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no feed de auto-update? ATENÇÃO: os terminais em operação se atualizam sozinhos. Desmarcado = ensaio (builda e testa, sem bump e sem publicar)."
        type: boolean
        default: true

# Enfileira em vez de cancelar: cancelar um run no meio da publicação deixaria
# o bucket com .exe novo e latest.yml velho (ou o inverso).
concurrency:
  group: release-kiosk
  cancel-in-progress: false

jobs:
  # Decide se vale gastar minutos de runner Windows. No disparo manual sempre
  # vale. No agendado, só se algo que entra no instalador mudou desde o último
  # commit de release.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Há mudança desde a última versão publicada?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publicar }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          LAST=$(git log -1 --format=%H --grep='^chore(release): kiosk v' || true)
          if [ -z "$LAST" ]; then
            echo "Nenhum commit de release encontrado; buildando por segurança."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # api/ (funções da Vercel), docs e testes não entram no instalador.
          if git diff --quiet "$LAST" HEAD -- \
              apps/kiosk apps/kiosk-ui packages pnpm-lock.yaml \
              ':(exclude)apps/kiosk-ui/api' \
              ':(exclude)apps/kiosk/package.json' \
              ':(exclude)**/*.md' \
              ':(exclude)**/*.test.ts' ':(exclude)**/*.test.tsx'; then
            echo "Sem mudança relevante desde $LAST. Nada a publicar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  bump-version:
    needs: gate
    if: ${{ needs.gate.outputs.changed == 'true' && needs.gate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Incrementar versão do kiosk
        id: bump
        run: |
          VERSION=$(node scripts/bump-kiosk-version.mjs)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Nova versão: $VERSION"

      # Sem trigger de push neste workflow, o commit de bump não dispara nada
      # (e push feito com GITHUB_TOKEN nunca dispara workflows de qualquer forma).
      - name: Commitar e publicar o bump direto na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/kiosk/package.json
          git commit -m "chore(release): kiosk v${{ steps.bump.outputs.version }} [skip-bump]"
          git push

  build:
    needs: [gate, bump-version]
    # bump-version é "skipped" num ensaio (publicar=false); isso não pode
    # impedir o build, só falha ou cancelamento.
    if: ${{ !cancelled() && needs.gate.outputs.changed == 'true' && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # Traz o commit de bump que o job anterior acabou de publicar — sem isso
      # o build pegaria a versão antiga e a publicação seria descartada pelo
      # electron-updater dos terminais (versão repetida).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Binário do Electron e ferramentas do electron-builder (NSIS, winCodeSign)
      # são baixados do GitHub a cada build; sem cache, é o passo mais lento
      # depois do próprio empacotamento. A chave muda com o lockfile (versão do
      # Electron/electron-builder).
      - uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Roda antes do empacotamento: se o guarda de credenciais falhar, o
      # build para aqui em vez de gerar um instalador com chave dentro.
      - name: Testes do kiosk
        run: pnpm --filter @facaamigos/kiosk test

      # Regras de preço/saldo (pacote Porto Seguro, saldo pré-pago, pausa) vivem
      # em domain e kiosk-ui. Sem este passo uma regressão de cobrança chega ao
      # balcão sem que nenhum teste a barre.
      - name: Testes de cobrança (domain e kiosk-ui)
        run: pnpm --filter @facaamigos/domain --filter @facaamigos/kiosk-ui test

      # NÃO cria apps/kiosk/.env. Esse arquivo é embutido no instalador
      # (extraResources), então um .env aqui faria a chave voltar a viajar
      # dentro de cada instalador. Cada terminal recebe a sua em
      # %APPDATA%\FacaAmigos\.env — ver apps/kiosk/.env.example.
      - name: Empacotar instalador
        run: pnpm dist:kiosk

      # Confere o ARTEFATO, não o código-fonte: é o bundle que vai para as
      # máquinas, e é nele que uma chave embutida faria estrago.
      - name: Conferir que o artefato não leva credencial
        shell: pwsh
        run: |
          $padroes = @('eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{20,}', 'sb_secret_[A-Za-z0-9_-]{20,}')
          $alvos = @('apps/kiosk/bundle/main.mjs')
          if (Test-Path 'apps/kiosk/release/win-unpacked/resources/.env') {
            throw 'O instalador levaria um .env embutido. Remova apps/kiosk/.env antes de empacotar.'
          }
          foreach ($alvo in $alvos) {
            $conteudo = Get-Content $alvo -Raw
            foreach ($padrao in $padroes) {
              if ($conteudo -match $padrao) { throw "Credencial embutida encontrada em $alvo" }
            }
          }
          Write-Host 'OK: nenhuma credencial no artefato.'

      # Este artifact É o que o job `publicar` sobe para o feed: o binário
      # publicado é o mesmo que foi testado e verificado acima. Retenção curta
      # porque só serve de ponte entre os dois jobs (e de depuração recente).
      - uses: actions/upload-artifact@v4
        with:
          name: FacaAmigos-Setup
          path: |
            apps/kiosk/release/*.exe
            apps/kiosk/release/*.exe.blockmap
            apps/kiosk/release/latest.yml
          if-no-files-found: error
          retention-days: 3

  # O Environment "producao" precisa continuar aqui: é dele que vêm
  # FACAAMIGOS_SUPABASE_URL/FACAAMIGOS_SUPABASE_SECRET_KEY (Environment
  # secrets, não secrets do repositório) — tirar essa linha derruba o
  # publish por falta de credencial (visto em produção: run 33288814977,
  # "ausentes" em release-kiosk.mjs). Se o objetivo é publicar sem esperar
  # aprovação, ajuste em Settings > Environments > producao > Required
  # reviewers — não removendo o environment daqui.
  #
  # Roda em Linux: só baixa o artifact e envia ao Supabase Storage (fetch +
  # fs, sem build), então não precisa de runner Windows nem de pnpm install.
  publicar:
    needs: [gate, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.gate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v4
        with:
          name: FacaAmigos-Setup
          path: apps/kiosk/release

      # As credenciais entram como variáveis de ambiente, nunca como
      # arquivo: release-kiosk.mjs lê process.env primeiro justamente para
      # o publish ter a chave sem que ela entre no instalador.
      - name: Publicar no feed
        env:
          FACAAMIGOS_SUPABASE_URL: ${{ secrets.FACAAMIGOS_SUPABASE_URL }}
          FACAAMIGOS_SUPABASE_SECRET_KEY: ${{ secrets.FACAAMIGOS_SUPABASE_SECRET_KEY }}
        run: node scripts/release-kiosk.mjs --skip-build
